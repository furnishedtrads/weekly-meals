<style>
/* Layout: phone-first app. Sticky day pills on top, one day at a time (swipe or tap), bottom bar for Days / Week / Pantry. Recipes open in a bottom sheet. */
:root{
  --bg:#F1F3EC; --card:#FFFFFF; --ink:#27302A; --muted:#667066; --line:#DDE2D6;
  --green:#40593F; --green-soft:#E3EAD9; --terra:#B25D3F; --terra-soft:#F4E2D9; --gold:#D9A455; --gold-soft:#F7EBD2;
  --on-green:#FFFFFF; --shadow:0 1px 2px rgba(30,45,30,.08),0 4px 14px rgba(30,45,30,.06);
  --head:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif; --body:'Lora',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121A15; --card:#1B261F; --ink:#E7EDE4; --muted:#9BA89C; --line:#2C3A30;
  --green:#8FB58C; --green-soft:#24362A; --terra:#E08A68; --terra-soft:#3A2A23; --gold:#E3B468; --gold-soft:#3A3223;
  --on-green:#10190F; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121A15; --card:#1B261F; --ink:#E7EDE4; --muted:#9BA89C; --line:#2C3A30;
  --green:#8FB58C; --green-soft:#24362A; --terra:#E08A68; --terra-soft:#3A2A23; --gold:#E3B468; --gold-soft:#3A3223;
  --on-green:#10190F; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:640px;margin:0 auto;padding-bottom:92px}
header{padding:18px 0 6px}
.eyebrow{font-family:var(--head);font-weight:600;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);margin:0}
h1{font-family:var(--head);font-weight:700;font-size:26px;line-height:1.15;margin:4px 0 2px;color:var(--green);text-wrap:balance}
.sub{margin:0;color:var(--muted);font-size:14px}
.pills{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:8px;overflow-x:auto;padding:10px 0;margin:0 -2px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;min-width:56px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:7px 8px;text-align:center;font-family:var(--head);line-height:1.15}
.pill b{display:block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.pill span{display:block;font-size:18px;font-weight:600}
.pill[aria-selected="true"]{background:var(--green);border-color:var(--green);color:var(--on-green)}
.pill[aria-selected="true"] b{color:var(--on-green);opacity:.85}
.pill .dot{display:block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin:3px auto 0;visibility:hidden}
.pill.today .dot{visibility:visible}
.day-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:10px 0 4px}
h2{font-family:var(--head);font-weight:600;font-size:20px;margin:0;line-height:1.2}
.tag{font-family:var(--head);font-size:12px;font-weight:500;background:var(--gold-soft);color:var(--ink);border-radius:999px;padding:4px 10px;white-space:nowrap}
.note{color:var(--muted);font-size:14.5px;margin:2px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 10px;margin:12px 0;box-shadow:var(--shadow)}
.card h3{font-family:var(--head);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px;color:var(--terra)}
.check{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.check:first-of-type{border-top:0}
.check input{appearance:none;-webkit-appearance:none;flex:0 0 24px;width:24px;height:24px;margin:1px 0 0;border:2px solid var(--green);border-radius:7px;background:transparent;display:grid;place-content:center}
.check input::after{content:"";width:12px;height:7px;border-left:3px solid var(--on-green);border-bottom:3px solid var(--on-green);transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.check input:checked{background:var(--green)}
.check input:checked::after{opacity:1}
.check input:focus-visible,.pill:focus-visible,.meal:focus-visible,.nav button:focus-visible,.x:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.check span{min-width:0}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.meal{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;min-height:56px}
.meal:first-of-type{border-top:0}
.slot{flex:0 0 74px;font-family:var(--head);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.mname{flex:1;min-width:0}
.mname small{display:block;color:var(--muted);font-size:13.5px;line-height:1.35}
.chev{flex:0 0 auto;color:var(--terra);font-family:var(--head);font-weight:600;font-size:12px}
.meal.dinner{background:var(--green-soft);border-radius:12px;border:0;padding:12px;margin:6px -4px}
.meal.dinner .slot{color:var(--green)}
.meal.dinner .mname{font-weight:500}
.swipe{font-size:12px;color:var(--muted);text-align:center;margin:8px 0 0;font-family:var(--head)}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th{font-family:var(--head);font-size:11px;letter-spacing:.07em;text-transform:uppercase;text-align:left;color:var(--muted);padding:6px 6px 6px 0;border-bottom:2px solid var(--line)}
td{padding:10px 6px 10px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.d{font-family:var(--head);font-weight:600;white-space:nowrap}
tr.now td{background:var(--gold-soft)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;gap:6px;background:var(--card);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.nav button{flex:1;max-width:200px;border:0;background:none;border-radius:12px;padding:9px 6px;font-family:var(--head);font-size:13px;font-weight:600;color:var(--muted);min-height:44px}
.nav button[aria-selected="true"]{background:var(--green);color:var(--on-green)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,18,12,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:85vh;max-height:85dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;border-radius:20px 20px 0 0;padding:16px max(18px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px))}
.sheet-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;position:sticky;top:-16px;background:var(--card);padding:4px 0 8px}
.sheet h2{font-size:19px}
.x{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);border-radius:999px;width:40px;height:40px;font-size:20px;line-height:1}
.serves{color:var(--terra);font-family:var(--head);font-size:13px;font-weight:500;margin:0 0 10px}
.sheet h4{font-family:var(--head);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 4px}
.sheet ul{margin:0;padding-left:20px}
.sheet li{margin:3px 0}
.sheet ol{margin:0;padding-left:22px}
.sheet ol li{margin:7px 0;padding-left:2px}
.sheet ol li::marker{color:var(--terra);font-family:var(--head);font-weight:600}
.pantry-note{color:var(--muted);font-size:14.5px}
.legend{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin:8px 0}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--gold);display:inline-block}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>

const DINNERS=[['Sat 17','Beef, bacon and potato stew (done)','One pot'],['Sun 18','Crock-pot whole chicken + instant potatoes + shells and cheese','Done'],['Mon 19','Crispy tenders and nuggets + roasted carrots, potatoes and mixed veg','Sheet pan'],['Tue 20','Skirt steak bowls + garlic toast + salad','Skillet'],['Wed 21','Soy-maple salmon + sweet potatoes + broccoli','Sheet pan'],['Thu 22','Slow-cooker sloppy joes','Slow cooker'],['Fri 23','Garlic butter shrimp + fettuccine + broccoli','Skillet']];
const PANTRY=['Chicken: about 1 cup of leftover meat for Wednesday\'s chicken salad, refrigerated by tonight','Chicken breasts: thawed in the fridge, use them Monday','Bread: 8 slices sandwich bread for Monday, 4 slices sourdough for Tuesday','Shells and cheese: 1 box left, for Thursday\'s lunch','Pita: 4 total (3 Friday, 1 Wednesday)','Butter: still unconfirmed. Friday shrimp and the cookies work with olive oil','Ranch seasoning packets: need about 3 (tenders, dip)','Canned peaches: 1 can for Thursday','Oats: about 3 3/4 cups for Tuesday, canister is about 1/3 full','Eggs: about 21 used this week, plenty left, plus 8 boiled Monday (4 for Anna, 2 kids Tuesday lunch, 2 kids Wednesday breakfast)','Red potatoes: about 7 left after the stew. 4 go on Monday\'s sheet pan, about 3 left','Ground beef: about 4 oz left from the first pound (add to Thursday\'s sloppy joes or freeze). Thursday uses the full second pound','Bacon: about 4 slices left, use or freeze','Leftover stew: 1 serving, for an adult lunch Monday or Tuesday','Frozen broccoli: 2 bags (Wed, Fri)'];

const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const todayIdx=(()=>{const d=new Date();if(d.getFullYear()===YEAR&&d.getMonth()===MONTH){const i=DAYS.findIndex(x=>x.n===d.getDate());return i}return -1})();
let tab='days', cur=store.get('day',null); if(cur===null||cur<0||cur>6) cur=todayIdx>=0?todayIdx:0;
const $=s=>document.querySelector(s), view=$('#view');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* Shared checklist: when DB_URL is filled in (Firebase Realtime Database), checks sync between phones live. Empty = this phone only. */
const DB_URL='https://weekly-meals-15fb2-default-rtdb.firebaseio.com', WEEK='wk-2026-10-17b';
let checks=store.get('checks-'+WEEK,{});
const ck=id=>String(id).replace(/[.$#\[\]\/]/g,'_');
function applyChecks(){document.querySelectorAll('.check input').forEach(i=>{i.checked=checks[ck(i.dataset.id)]===true})}
function pushCheck(id,v){checks[ck(id)]=v;store.set('checks-'+WEEK,checks);
  if(DB_URL)fetch(DB_URL+'/'+WEEK+'/'+ck(id)+'.json',{method:'PUT',body:JSON.stringify(v)}).catch(()=>{})}
function pullChecks(){fetch(DB_URL+'/'+WEEK+'.json').then(r=>r.json()).then(d=>{checks=d||{};store.set('checks-'+WEEK,checks);applyChecks()}).catch(()=>{})}
function startSync(){if(!DB_URL)return;pullChecks();
  try{const es=new EventSource(DB_URL+'/'+WEEK+'.json');es.addEventListener('put',pullChecks);es.addEventListener('patch',pullChecks)}catch(e){setInterval(pullChecks,5000)}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)pullChecks()})}
function checkRow(id,text){const on=checks[ck(id)]===true;return `<label class="check"><input type="checkbox" data-id="${id}" ${on?'checked':''}><span>${esc(text)}</span></label>`}

function renderDays(){
  const d=DAYS[cur];
  const pills=DAYS.map((x,i)=>`<button class="pill ${i===todayIdx?'today':''}" role="tab" data-i="${i}" aria-selected="${i===cur}"><b>${x.wd}</b><span>${x.n}</span><i class="dot"></i></button>`).join('');
  const am=d.am.length?`<section class="card"><h3>Start this morning</h3>${d.am.map((t,i)=>checkRow(d.k+'-am-'+i,t)).join('')}</section>`:'';
  const meals=d.meals.map((m,i)=>{
    const cls=m[0]==='Dinner'?'meal dinner':'meal';
    const has=!!m[3];
    return `<button class="${cls}" data-r="${m[3]||''}" ${has?'':'disabled style="cursor:default"'}><span class="slot">${m[0]}</span><span class="mname">${esc(m[1])}${m[2]?`<small>${esc(m[2])}</small>`:''}</span>${has?'<span class="chev">Recipe</span>':''}</button>`}).join('');
  const pm=d.pm.length?`<section class="card"><h3>Later today</h3>${d.pm.map((t,i)=>checkRow(d.k+'-pm-'+i,t)).join('')}</section>`:'';
  view.innerHTML=`<div class="pills" role="tablist" aria-label="Days">${pills}</div>
  <div id="panel"><div class="day-head"><h2>${d.wd==='Sat'?'Saturday':d.wd==='Sun'?'Sunday':d.wd==='Mon'?'Monday':d.wd==='Tue'?'Tuesday':d.wd==='Wed'?'Wednesday':d.wd==='Thu'?'Thursday':'Friday'}, Oct ${d.n}</h2><span class="tag">${esc(d.tag)}</span></div>
  <p class="note">${esc(d.note)}</p>
  ${am}
  ${d.meals.length?`<section class="card"><h3>Meals</h3>${meals}</section>`:''}
  ${pm}
  <p class="swipe">Swipe left or right to change day</p></div>`;
  const act=view.querySelector('.pill[aria-selected="true"]'); if(act) act.scrollIntoView({inline:'center',block:'nearest'});
}
function renderWeek(){
  const rows=DINNERS.map((r,i)=>`<tr class="${i===todayIdx?'now':''}"><td class="d">${r[0]}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('');
  view.innerHTML=`<div class="day-head"><h2>The week at a glance</h2></div><p class="note">Dinners only. Tap Days for everything else, one day at a time.</p>
  <section class="card"><table><thead><tr><th>Day</th><th>Dinner</th><th>Method</th></tr></thead><tbody>${rows}</tbody></table></section>
  <section class="card"><h3>Method mix</h3><p style="margin:4px 0 10px">1 slow-cooker night (Thu), 2 sheet-pan nights (Mon, Wed), 2 quick skillet nights (Tue, Fri). Dinner is on the table about 5:30.</p></section>
  <section class="card"><h3>Desserts</h3><p style="margin:4px 0 10px">Mon Halloween potato chip cookies, Tue banana pudding parfaits, Wed warm cinnamon apples, Thu peaches and cream, Fri chocolate hummus dip (new test). The pudding-yogurt cups and the frozen banana bites were dropped this week.</p></section>`;
}
function renderPantry(){
  view.innerHTML=`<div class="day-head"><h2>Pantry check</h2></div><p class="note">Things to eyeball before the day they are used. Tap to check off.</p>
  <section class="card">${PANTRY.map((t,i)=>checkRow('pantry-'+i,t)).join('')}</section>`;
}
function render(){ if(tab==='days')renderDays(); else if(tab==='week')renderWeek(); else renderPantry();
  document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab)); window.scrollTo(0,0)}

function openSheet(id){
  const r=R[id]; if(!r) return;
  $('#sheet-root').innerHTML=`<div class="sheet-bg" id="sbg"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(r.t)}"><div class="sheet-top"><h2>${esc(r.t)}</h2><button class="x" aria-label="Close recipe">&times;</button></div><p class="serves">${esc(r.s)}</p><h4>Ingredients</h4><ul>${r.ing.map(i=>`<li>${esc(i)}</li>`).join('')}</ul><h4>Steps</h4><ol>${r.st.map(i=>`<li>${esc(i)}</li>`).join('')}</ol></div></div>`;
  document.body.style.overflow='hidden';
  $('#sheet-root .x').focus();
}
function closeSheet(){$('#sheet-root').innerHTML='';document.body.style.overflow=''}

document.addEventListener('click',e=>{
  const p=e.target.closest('.pill'); if(p){cur=+p.dataset.i;store.set('day',cur);render();return}
  const nb=e.target.closest('.nav button'); if(nb){tab=nb.dataset.tab;render();return}
  const m=e.target.closest('.meal'); if(m&&m.dataset.r){openSheet(m.dataset.r);return}
  if(e.target.closest('.x')||e.target.id==='sbg'){closeSheet();return}
});
document.addEventListener('change',e=>{const c=e.target.closest('.check input'); if(c) pushCheck(c.dataset.id,c.checked)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
let sx=null,sy=null;
document.addEventListener('touchstart',e=>{if(tab!=='days'||$('#sheet-root').innerHTML)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
  if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6){cur=Math.max(0,Math.min(6,cur+(dx<0?1:-1)));store.set('day',cur);render()}},{passive:true});
render();
startSync();
</script>
</body>
